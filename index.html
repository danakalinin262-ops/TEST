<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stars Test</title>
  <script src="https://telegram.org"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    button {
      padding: 18px 32px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #2481cc;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="btn">Оплатить 1 ⭐️</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    document.getElementById('btn').addEventListener('click', function() {
      const params = new URLSearchParams(window.location.search);
      const invoice = params.get('invoice');

      // 1. Проверка: открыто ли в Telegram
      if (tg.platform === 'unknown') {
        alert('Ошибка: вы открыли сайт в обычном браузере! Откройте его внутри Telegram.');
        return;
      }

      // 2. Проверка: передан ли счёт
      if (!invoice) {
        alert('Ошибка: счёт не передан в URL. Нажмите кнопку именно в сообщении бота!');
        return;
      }

      // 3. Запуск оплаты
      tg.openInvoice(invoice, function(status) {
        alert('Результат оплаты: ' + status);
      });
    });
  </script>
</body>
</html>
